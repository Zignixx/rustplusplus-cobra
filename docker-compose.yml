version: '3.3'
services:
    app:
        volumes:
            - ./credentials:/app/credentials
            - ./instances:/app/instances
            - ./logs:/app/logs
            - ./maps:/app/maps
        ports:
            - "24343:24343"
        environment:
            - RPP_DISCORD_CLIENT_ID=111....1111
            - RPP_DISCORD_TOKEN=token
            # Optional: Battlemetrics token (no quotes), needed for Battlemetrics and trackers
            - RPP_BATTLEMETRICS_TOKEN=
            # Optional: token for the read-only HTTP API on port 24343 (at least 16 characters)
            - RPP_API_TOKEN=
            # Optional: how often positions are refreshed for connected dashboards (ms, default 2000)
            # - RPP_API_LIVE_INTERVAL=2000
            # Optional: how often the server's own player list is read (ms, default 60000, 0 = off)
            # - RPP_SERVER_QUERY_INTERVAL=60000
        container_name: rpp
        image: ghcr.io/zignixx/rustplusplus-cobra:latest
